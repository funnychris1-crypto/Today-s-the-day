<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help a Canadian in Need - Bitcoin Donations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Help a Canadian in Need</h1>
            <p class="subtitle">Send Bitcoin to make a real difference</p>
            
            <div class="donation-section">
                <div class="qr-code">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=bitcoin:18ptWouViWf6UkZ1CTJkyUoWSSyzAe3KAQ" alt="Bitcoin QR Code">
                </div>
                
                <div class="address-section">
                    <label>Bitcoin Address:</label>
                    <div class="address-box">
                        <span id="address">18ptWouViWf6UkZ1CTJkyUoWSSyzAe3KAQ</span>
                        <button id="copyBtn" class="copy-btn">Copy</button>
                    </div>
                </div>

                <div class="amount-section">
                    <label for="amount">Donation Amount (BTC):</label>
                    <input type="number" id="amount" placeholder="0.001" step="0.00000001" min="0">
                </div>

                <button id="donateBtn" class="donate-btn">Donate Now</button>
            </div>

            <p class="footer-text">Every donation helps. Thank you for your generosity.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
